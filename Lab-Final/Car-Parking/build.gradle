plugins {
    id 'java'
    id 'application'
}

application {
    // The examination runs the submission as:  javac *.java  &&  java Main
    mainClass = 'Main'
}

// ./gradlew run --console=plain < sample_input.txt
run {
    standardInput = System.in
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}